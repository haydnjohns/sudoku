[project]
name = "sudoku"
version = "0.1.0"
description = "Sudoku-solving robot project"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "gpiozero>=2.0.1.post3",
    "ai-edge-litert>=2.0.0",
    "numpy>=2.5.4",
    "scikit-image>=0.26.0",
    "scipy>=1.18.1",
]

[dependency-groups]
pi = [
    "opencv-python-headless>=5.0.0.93",
]
dev = [
    "opencv-python>=5.0.0.93",
    "tensorflow>=2.21.0",
    "keras>=3.15.1",
    "scikit-learn>=1.9.1",
    "matplotlib>=3.11.2",
    "pillow>=13.0.0",
    # "tensorflow-metal",  # optional Apple GPU; check TF version compatibility first
]

[tool.uv]
package = false
conflicts = [
    [
        { group = "dev" },
        { group = "pi" },
    ],
]